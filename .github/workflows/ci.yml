# ─────────────────────────────────────────────────────────────────────────────
#  .github/workflows/ci.yml
#  Dexilate CI — builds and tests on macOS, Windows, and Linux on every push/PR.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.7.2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name:     "macOS arm64"
            os:       macos-14
            preset:   macos-arm64
            artifact: dexilate-macos-arm64
            qt_arch:  clang_64

          - name:     "Windows x64"
            os:       windows-2022
            preset:   windows-x64
            artifact: dexilate-windows-x64
            qt_arch:  win64_msvc2022_64

          - name:     "Linux x64"
            os:       ubuntu-24.04
            preset:   linux-x64
            artifact: dexilate-linux-x64
            qt_arch:  gcc_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglib2.0-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev \
            libxkbcommon-dev libwayland-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt6
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-${{ runner.os }}

      - name: Install Qt6
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch:    ${{ matrix.qt_arch }}
          dir:     ${{ github.workspace }}/qt6
          cache:   true

      - name: Set Qt6_DIR
        shell: bash
        run: |
          echo "Qt6_DIR=${{ github.workspace }}/qt6/Qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/${{ matrix.preset }}/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_PREFIX_PATH="${Qt6_DIR}"

      - name: Build
        shell: bash
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        shell: bash
        working-directory: build/${{ matrix.preset }}
        run: ctest --output-on-failure --parallel 4 --timeout 120

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.artifact }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.preset }}/bin/
          retention-days: 14

  license-check:
    name: License compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX identifiers
        run: |
          if [ ! -d src ]; then
            echo "src/ directory not yet created — skipping SPDX check."
            exit 0
          fi
          missing=$(grep -rL "SPDX-License-Identifier" src/ \
                    --include="*.cpp" --include="*.h" --include="*.mm" 2>/dev/null | head -20)
          if [ -n "$missing" ]; then
            echo "Files missing SPDX identifiers:"
            echo "$missing"
            exit 1
          fi
          echo "All source files have SPDX identifiers."
